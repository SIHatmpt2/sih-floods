services:

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flood_db}
      POSTGRES_USER: ${POSTGRES_USER:-flood_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flood_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flood_user} -d ${POSTGRES_DB:-flood_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6384:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flood_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-flood_minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "9005:9000"
      - "9006:9001"

  backend:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flood_db}
      POSTGRES_USER: ${POSTGRES_USER:-flood_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flood_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend:/app
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"

  worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flood_db}
      POSTGRES_USER: ${POSTGRES_USER:-flood_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flood_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: celery -A config.celery worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
