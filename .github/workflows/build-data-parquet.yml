name: Build CWC Parquet datasets

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-parquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t sih-floods-backend-ci -f docker/django/Dockerfile .

      - name: Run Django checks and data-processing tests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend:/app" \
            -w /app \
            sih-floods-backend-ci \
            sh -c 'python -m pip install --no-cache-dir pytest && python manage.py check && pytest data_processing/tests -q'

      - name: Build river Parquet
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend:/app" \
            -w /app \
            sih-floods-backend-ci \
            python -m data_processing.rivers.pipeline

      - name: Build rainfall Parquet
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend:/app" \
            -w /app \
            sih-floods-backend-ci \
            python -m data_processing.rainfall.pipeline

      - name: Upload CWC Parquet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cwc-parquet
          path: |
            backend/apps/risk/data/processed/river_data/parquet/*.parquet
            backend/apps/risk/data/processed/rainfall/parquet/*.parquet
          if-no-files-found: error
