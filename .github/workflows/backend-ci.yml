name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-ci.yml"
      - "frontend/**"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/backend-ci.yml"
      - "frontend/**"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: flood_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d flood_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t sih-floods-backend-ci -f docker/django/Dockerfile .
      - name: Django checks, migrations, and tests
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=flood_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            -e DJANGO_SECRET_KEY=ci-test-secret \
            -v "$GITHUB_WORKSPACE/backend:/app" \
            -w /app \
            sih-floods-backend-ci \
            sh -c 'python manage.py check && python manage.py makemigrations --check && python manage.py migrate --noinput && python manage.py test apps.core apps.risk apps.weather'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run check
